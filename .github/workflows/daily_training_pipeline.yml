name: Daily Model Training & 3-Day Forecast Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  retrain_and_forecast:
    runs-on: ubuntu-latest
    permissions:                   
      contents: write

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Leaderboard Training
      env:
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      run: |
        python scripts/train_model.py

    - name: Generate Forecasts
      env:
        HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      run: |
        python scripts/explain_model.py

    - name: Auto Commit Latest SHAP Plots
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add models/shap_summary.png
        
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated Daily Update [skip ci]"
          
          git pull origin main --rebase
          
          git push origin main
        else
          print "No changes detected in SHAP plots."
        fi
